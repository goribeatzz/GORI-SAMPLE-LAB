name: Validate GORI SAMPLE LAB
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate PWA manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
      - name: Check required application files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sw.js
          test -s icons/icon.svg
          grep -q 'GORI SAMPLE LAB' index.html
